<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>잠자는 토끼 타이머 🐰</title>
  <style>
    body { font-family: 'Pretendard', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #f4f6f8; margin: 0; padding: 20px; text-align: center; }
    .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 400px; width: 100%; }
    h1 { font-size: 1.5rem; color: #333; }
    .rabbit-display { font-size: 5rem; margin: 20px 0; transition: transform 0.3s ease; }
    .status-text { font-size: 1.2rem; font-weight: bold; color: #555; min-height: 30px; }
    .db-meter { margin-top: 10px; font-size: 0.9rem; color: #888; }
    select, button { width: 100%; padding: 12px; margin-top: 15px; border-radius: 10px; border: 1px solid #ddd; font-size: 1rem; }
    button { background-color: #4CAF50; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    button:hover:not(:disabled) { background-color: #45a049; }
    .feedback-box { margin-top: 20px; padding: 15px; background: #eef2ff; border-radius: 10px; font-size: 0.95rem; display: none; white-space: pre-wrap; }
    .progress-bar { width: 100%; background-color: #e0e0e0; border-radius: 5px; margin-top: 15px; overflow: hidden; }
    .progress-fill { height: 10px; background-color: #4CAF50; width: 0%; transition: width 1s linear; }
  </style>
</head>
<body>

<div class="container">
  <h1>쉿! 토끼가 자고 있어요</h1>
  
  <select id="modeSelect">
    <option value="30">공부/집중 모드 (30분)</option>
    <option value="15">어린이 수면/정숙 훈련 (15분)</option>
    <option value="60">회의/스터디룸 소음 관리 (60분)</option>
    <option value="1">테스트 모드 (1분)</option>
  </select>

  <div class="rabbit-display" id="rabbit">🐰</div>
  <div class="status-text" id="status">모드를 선택하고 시작해주세요!</div>
  <div class="db-meter" id="dbMeter">현재 데시벨: 0 dB | 기준: 미정</div>
  
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <button id="startBtn">시작하기 (10초 소음 측정 후 시작)</button>
  
  <div class="feedback-box" id="feedback"></div>
</div>

<script>
  let audioContext, analyser, microphone, dataArray;
  let isRunning = false;
  let threshold = 50; 
  let wakeCount = 0;
  let timerInterval;
  let totalDuration, timeRemaining;

  const rabbitEl = document.getElementById('rabbit');
  const statusEl = document.getElementById('status');
  const dbMeterEl = document.getElementById('dbMeter');
  const startBtn = document.getElementById('startBtn');
  const feedbackEl = document.getElementById('feedback');
  const modeSelect = document.getElementById('modeSelect');
  const progressFill = document.getElementById('progressFill');

  async function initAudio() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      microphone = audioContext.createMediaStreamSource(stream);
      microphone.connect(analyser);
      analyser.fftSize = 256;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      return true;
    } catch (err) {
      alert("마이크 권한이 필요합니다!");
      return false;
    }
  }

  function getDecibels() {
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) {
      sum += dataArray[i];
    }
    const average = sum / dataArray.length;
    return Math.max(0, Math.round((average / 256) * 100 + 20));
  }

  async function calibrateNoise() {
    statusEl.innerText = "주변 소음 학습 중... (10초)";
    let samples = [];
    let calibTime = 0;
    
    return new Promise((resolve) => {
      const interval = setInterval(() => {
        const db = getDecibels();
        samples.push(db);
        dbMeterEl.innerText = `현재 데시벨: ${db} dB | 학습 중...`;
        calibTime++;
        
        if (calibTime >= 100) { 
          clearInterval(interval);
          const avgNoise = samples.reduce((a, b) => a + b, 0) / samples.length;
          threshold = Math.round(avgNoise + 15); 
          resolve(threshold);
        }
      }, 100);
    });
  }

  function startTimerLoop(durationMinutes) {
    totalDuration = durationMinutes * 60;
    timeRemaining = totalDuration;
    wakeCount = 0;
    isRunning = true;
    
    rabbitEl.innerText = "🐰💤";
    statusEl.innerText = "토끼가 얕은 잠에 들었어요.";
    
    timerInterval = setInterval(() => {
      timeRemaining--;
      const progress = ((totalDuration - timeRemaining) / totalDuration) * 100;
      progressFill.style.width = `${progress}%`;

      const currentDb = getDecibels();
      dbMeterEl.innerText = `현재 데시벨: ${currentDb} dB | 기준: ${threshold} dB`;

      if (progress < 25) {
        handleSleepState(currentDb, threshold, "얕은 잠");
      } else if (progress < 75) {
        const deepThreshold = threshold + 10;
        if (currentDb > threshold && currentDb <= deepThreshold) {
          rabbitEl.innerText = "🐰💦";
          statusEl.innerText = "토끼가 움찔거려요!";
        } else {
          handleSleepState(currentDb, deepThreshold, "깊은 잠");
        }
      } else if (progress < 100) {
        handleSleepState(currentDb, threshold, "잠 깰 준비");
      }

      if (timeRemaining <= 0) {
        clearInterval(timerInterval);
        isRunning = false;
        rabbitEl.innerText = "🐇✨";
        statusEl.innerText = "기분 좋게 일어났어요!";
        dbMeterEl.innerText = "타이머 종료";
        startBtn.disabled = false;
        fetchAIResult(durationMinutes, wakeCount);
      }
    }, 1000);
  }

  function handleSleepState(currentDb, currentThreshold, phase) {
    if (currentDb > currentThreshold) {
      rabbitEl.innerText = "🐰👀";
      statusEl.innerText = `앗! 시끄러워서 깼어요! (${phase})`;
      wakeCount++;
      rabbitEl.style.transform = "scale(1.2)";
      setTimeout(() => rabbitEl.style.transform = "scale(1)", 300);
    } else {
      rabbitEl.innerText = "🐰💤";
      statusEl.innerText = `쉿.. 토끼가 잘 자고 있어요. (${phase})`;
    }
  }

  async function fetchAIResult(duration, wakes) {
    feedbackEl.style.display = 'block';
    feedbackEl.innerText = "토끼가 일기를 쓰는 중... ✍️🐰";

    try {
      const response = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ duration, wakes })
      });
      const data = await response.json();
      feedbackEl.innerText = data.message;
    } catch (error) {
      feedbackEl.innerText = `결과를 불러오지 못했어요. (총 ${wakes}번 깸)`;
    }
  }

  startBtn.addEventListener('click', async () => {
    if (!await initAudio()) return;
    
    startBtn.disabled = true;
    feedbackEl.style.display = 'none';
    progressFill.style.width = '0%';
    
    const newThreshold = await calibrateNoise();
    statusEl.innerText = `이 방에서는 ${newThreshold}dB 이상일 때 토끼가 깹니다!`;
    
    setTimeout(() => {
      startTimerLoop(parseInt(modeSelect.value));
    }, 3000);
  });
</script>
</body>
</html>
